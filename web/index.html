<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2A47C9">
  <title>Apollo</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/icon-192.png">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <main id="app" aria-live="polite">
    <p class="muted center">Chargement…</p>
  </main>

  <template id="tpl-account">
    <div class="screen">
      <form class="card" id="form-account">
        <h1>Bienvenue sur Apollo</h1>
        <p class="muted">Crée le compte administrateur. Il reste sur cette machine.</p>
        <label>Nom d'utilisateur <input id="username" autocomplete="username" required minlength="2"></label>
        <label>Mot de passe <input id="password" type="password" autocomplete="new-password" required minlength="8"></label>
        <p class="error" hidden></p>
        <button type="submit">Créer le compte</button>
      </form>
    </div>
  </template>

  <template id="tpl-login">
    <div class="screen">
      <form class="card" id="form-login">
        <h1>Apollo</h1>
        <label>Nom d'utilisateur <input id="username" autocomplete="username" required></label>
        <label>Mot de passe <input id="password" type="password" autocomplete="current-password" required></label>
        <p class="error" hidden></p>
        <button type="submit">Se connecter</button>
      </form>
    </div>
  </template>

  <template id="tpl-model">
    <form class="card wide" id="form-model">
      <div>
        <h1>Le cerveau de tes agents</h1>
        <p class="muted">La clé reste chiffrée sur cette machine. Les agents ne la voient jamais : ils passent par Apollo.</p>
      </div>
      <div class="providers" id="providers" role="radiogroup" aria-label="Fournisseur"></div>
      <div class="key-row" id="key-field">
        <label>Clé API <input id="api-key" type="password" autocomplete="off"></label>
        <button type="button" class="ghost" id="load-models">Afficher les modèles</button>
      </div>
      <input type="search" id="model-search" placeholder="Rechercher un modèle (ex. claude, gemini, deepseek)…" aria-label="Rechercher un modèle">
      <div class="catalog" id="catalog"><p class="muted">Chargement des modèles…</p></div>
      <div class="picked">
        <div><span class="muted">Modèle choisi</span><strong id="picked-name">aucun</strong></div>
        <label class="budget">Budget mensuel ($) <input id="budget" type="number" min="0" step="1" placeholder="Illimité"></label>
      </div>
      <p class="usage muted" id="usage-line" hidden></p>
      <p class="error" hidden></p>
      <div class="row end">
        <button type="button" class="ghost" id="model-cancel" hidden>Annuler</button>
        <button type="submit" id="model-save">Enregistrer</button>
      </div>
    </form>
  </template>

  <template id="tpl-agent">
    <form class="card" id="form-agent">
      <h1 id="agent-title">Nouvel agent</h1>
      <p class="muted">Chaque agent a sa propre machine, sa mémoire et ses fichiers.</p>
      <label>Nom <input id="agent-name" required maxlength="40" placeholder="Ex. Courriel, Recherche"></label>
      <label>Rôle et consignes <textarea id="agent-role" rows="5" maxlength="4000" placeholder="Ex. Tu tries mes courriels chaque matin et tu me signales seulement ce qui demande une réponse."></textarea></label>
      <p class="error" hidden></p>
      <div class="row end">
        <button type="button" class="ghost danger" id="agent-delete" hidden>Supprimer</button>
        <button type="button" class="ghost" id="agent-cancel">Annuler</button>
        <button type="submit" id="agent-save">Créer l'agent</button>
      </div>
    </form>
  </template>

  <template id="tpl-shell">
    <div class="shell">
      <aside class="side" id="side">
        <div class="side-head">
          <strong class="brand">Apollo</strong>
          <button type="button" class="icon only-mobile" id="close-side" aria-label="Fermer le menu">✕</button>
        </div>
        <div class="side-section">
          <div class="side-title"><span>Agents</span><button type="button" class="link" id="add-agent">+ Nouveau</button></div>
          <ul class="list" id="agents"></ul>
        </div>
        <div class="side-section grow">
          <div class="side-title"><span>Conversations</span><button type="button" class="link" id="new-chat">+ Nouvelle</button></div>
          <ul class="list" id="conversations"></ul>
        </div>
        <div class="side-foot">
          <button type="button" class="link" id="open-model">Modèle et budget : <span id="model-name">…</span></button>
          <span class="muted small" id="spend"></span>
          <button type="button" class="link" id="logout">Se déconnecter</button>
        </div>
      </aside>
      <div class="scrim only-mobile" id="scrim" hidden></div>
      <section class="chat">
        <header class="bar">
          <button type="button" class="icon only-mobile" id="open-side" aria-label="Ouvrir le menu">☰</button>
          <div class="agent-head">
            <strong id="agent-name-head">…</strong>
            <span class="status" id="agent-status"></span>
          </div>
          <label class="toggle"><input type="checkbox" id="details"> Détails techniques</label>
          <button type="button" class="ghost small" id="edit-agent">Réglages</button>
          <button type="button" class="ghost small" id="toggle-panel" aria-pressed="false">Ordinateur</button>
        </header>
        <div class="messages" id="messages"></div>
        <div class="attachments" id="attachments" hidden></div>
        <form class="composer" id="composer">
          <label class="attach" title="Joindre des fichiers" aria-label="Joindre des fichiers">
            <input type="file" id="file-input" multiple hidden>+
          </label>
          <textarea id="input" rows="1" placeholder="Écris à ton agent…" required></textarea>
          <button type="submit" id="send">Envoyer</button>
          <button type="button" class="ghost" id="stop" hidden>Arrêter</button>
        </form>
      </section>
      <aside class="panel" id="panel" hidden>
        <div class="panel-head">
          <div class="tabs" role="tablist">
            <button type="button" role="tab" data-tab="details">Détails</button>
            <button type="button" role="tab" data-tab="files">Fichiers</button>
            <button type="button" role="tab" data-tab="computer">Ordinateur</button>
          </div>
          <button type="button" class="icon" id="close-panel" aria-label="Fermer le panneau">✕</button>
        </div>
        <div class="tab-body" id="tab-details" hidden></div>
        <div class="tab-body" id="tab-files" hidden></div>
        <div class="tab-body" id="tab-computer" hidden>
          <div class="screen">
            <iframe id="screen" title="Écran de l'agent" hidden></iframe>
            <div class="screen-empty" id="screen-empty">
              <strong>Navigateur de l'agent</strong>
              <span class="muted">L'écran apparaît ici dès que l'agent ouvre une page.</span>
            </div>
          </div>
          <div class="row">
            <button type="button" id="take-control">Prendre le contrôle</button>
            <button type="button" class="ghost" id="screen-reload">Rafraîchir</button>
            <a class="ghost button" id="screen-open" target="_blank" rel="noopener">Plein écran</a>
          </div>
          <p class="muted small" id="control-hint">Lecture seule : l'agent garde la main. Prends le contrôle pour te connecter à un site ou résoudre un CAPTCHA, puis dis-lui de continuer.</p>
        </div>
      </aside>
      <div class="modal" id="preview" hidden>
        <div class="preview-box">
          <div class="preview-head">
            <strong id="preview-title"></strong>
            <div class="row">
              <a class="ghost button" id="preview-open" target="_blank" rel="noopener">Ouvrir dans un onglet</a>
              <button type="button" class="icon" id="preview-close" aria-label="Fermer l'aperçu">✕</button>
            </div>
          </div>
          <iframe id="preview-frame" title="Aperçu" sandbox="allow-scripts allow-forms allow-popups allow-modals"></iframe>
        </div>
      </div>
      <div class="modal" id="modal" hidden></div>
    </div>
  </template>

  <script src="/assets/app.js"></script>
</body>
</html>
