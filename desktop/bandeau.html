<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; connect-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'">
<title data-i18n="bandeau.page">Accord sur cet ordinateur — Noah</title>
<style>
  :root { color-scheme: light dark; font: 15px system-ui, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 12px 16px; height: 100vh; overflow: auto; display: flex; flex-direction: column; gap: 8px; background: light-dark(#faf8f5, #1c1a18); color: light-dark(#3a3530, #e8e2da); border-bottom: 1px solid light-dark(#c9bfb3, #696059); }
  h1 { font-size: 16px; margin: 0; }
  p { margin: 0; }
  #detail { flex: 1; min-height: 30px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; }
  #buttons { display: flex; gap: 8px; flex-wrap: wrap; }
  button { appearance: none; font: inherit; padding: 8px 12px; border: 1px solid transparent; border-radius: 10px; background: transparent; color: inherit; cursor: pointer; }
  button.primary { background: #2a47c9; color: #fff; border-color: #2a47c9; }
  button.secondary { border-color: light-dark(#8b8178, #a99f95); }
  button.discreet { text-decoration: underline; text-underline-offset: 3px; }
  button:hover { filter: brightness(.92); }
  button:disabled { cursor: default; opacity: .55; }
  button:focus-visible { outline: 3px solid #2a47c9; outline-offset: 2px; }
  small { font-size: 12px; }
</style>
<h1 data-i18n="bandeau.titre">Accord sur cet ordinateur</h1>
<p id="message" role="status"></p>
<div id="detail" tabindex="0" aria-label="Action exacte à vérifier" data-i18n-aria-label="bandeau.detail"></div>
<div id="buttons" aria-label="Répondre à la demande" data-i18n-aria-label="bandeau.boutons"></div>
<small data-i18n="bandeau.raccourcis">Ctrl + Alt + A : autoriser une fois · Ctrl + Alt + R : refuser. Expire après 4 min 40.</small>
</html>
