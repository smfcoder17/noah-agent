<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; img-src 'self'" />
<title>Noah Agent</title>
<style>
  :root { --bg: #faf8f5; --fg: #3a3530; --muted: #7a7168; --line: #ddd4c9; --card: #ffffff; --accent: #c2410c; --danger: #b91c1c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1c1a18; --fg: #e8e2da; --muted: #a39a90; --line: #3a3530; --card: #24211e; --accent: #fb923c; --danger: #f87171; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 15px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  main { width: min(460px, 100% - 32px); display: flex; flex-direction: column; gap: 14px; }
  h1 { font-size: 22px; margin: 0; } p { margin: 0; color: var(--muted); }
  img { width: 44px; height: 44px; }
  .choice { text-align: left; display: flex; flex-direction: column; gap: 2px; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: inherit; font: inherit; cursor: pointer; }
  .choice:hover { border-color: var(--accent); } .choice b { font-size: 15px; } .choice span { color: var(--muted); font-size: 13px; }
  form { display: none; flex-direction: column; gap: 10px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; }
  input { font: inherit; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: inherit; }
  .row { display: flex; gap: 8px; justify-content: flex-end; }
  button.main { font: inherit; padding: 9px 16px; border-radius: 10px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
  button.ghost { font: inherit; padding: 9px 16px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: inherit; cursor: pointer; }
  a { color: var(--accent); }
  #error { color: var(--danger); font-size: 13px; min-height: 1em; }
  .hint { font-size: 12px; }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="" />
  <h1 data-i18n="setup.bienvenue">Bienvenue sur Noah Agent</h1>
  <div id="choices" style="display:flex;flex-direction:column;gap:10px">
    <p data-i18n="setup.question">Où vit ton agent ?</p>
    <button class="choice" id="remote"><b data-i18n="setup.serveur.titre">Sur mon serveur</b><span data-i18n="setup.serveur.texte">Un VPS où Noah tourne 24 h/24. Ton ordinateur, ton téléphone et le web parlent au même agent.</span></button>
    <button class="choice" id="local"><b data-i18n="setup.local.titre">Sur cet ordinateur</b><span data-i18n="setup.local.texte">Noah tourne ici avec Docker Desktop. Il s'arrête quand l'ordinateur s'éteint.</span></button>
  </div>
  <form id="form">
    <p data-i18n="setup.consigne">Saisis l'adresse de ton Noah. Ton navigateur s'ouvre : connecte-toi si besoin, puis clique « Autoriser cet appareil ».</p>
    <label><span data-i18n="setup.adresse">Adresse de ton serveur</span><input id="server" placeholder="https://noah.exemple.com" data-i18n-placeholder="setup.adresse.exemple" autocomplete="url" required /></label>
    <label id="codeRow" style="display:none"><span data-i18n="setup.code">Code (Réglages → Appareils → « Relier un appareil »)</span><input id="code" placeholder="BCDF-GHJK" autocomplete="one-time-code" /></label>
    <p class="hint"><a href="#" id="toggle" data-i18n="setup.avec_code">J'ai un code à la place</a></p>
    <label id="numberRow" style="display:none"><span data-i18n="setup.nombre">Nombre affiché dans le navigateur, après « Autoriser »</span><input id="number" inputmode="numeric" maxlength="3" autocomplete="off" /></label>
    <div id="error"></div>
    <div class="row"><button type="button" class="ghost" id="back" data-i18n="setup.retour">Retour</button><button class="main" id="go" data-i18n="setup.relier">Relier</button></div>
  </form>
</main>
<script src="textes.js"></script>
<script src="setup.js"></script>
</body>
</html>
