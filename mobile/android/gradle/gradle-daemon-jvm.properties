# La chaîne Android (AGP 8.13, Capacitor 8) demande un JDK 21 : le démon Gradle démarre ainsi sur ce JDK,
# même si le java du PATH est plus vieux (voir docs/references.md et apps.yml, qui installe Java 21).
# Sans JDK 21 du tout sur la machine, Gradle échoue là où la CI (apps.yml) en installe un — voir settings.gradle.
toolchainVersion=21
