# Tests des mises à jour automatiques : logique (signature, créneau, reports) et transaction sur de vrais conteneurs
# (retour arrière avec les données, coupure brutale, relais du lanceur). Une version ne part pas si l'un échoue.
name: Tests

# Pas de lancement à chaque envoi : la CI est limitée. En local : node scripts/verifier.mjs
on:
  workflow_dispatch:
  workflow_call:  # appelé par release.yml : pas d'image ni de manifeste si un test échoue
    inputs:
      rapide:  # image edge de main : cette même suite tourne en entier à côté, seule une version l'attend
        type: boolean
        default: false

jobs:
  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx tsc --noEmit && npx tsc -p tsconfig.app.json --noEmit --incremental false && npm test
        working-directory: frontend
  updates:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: "Publication : workflows, manifeste signé, compose épinglé, clés exigées, préparation des signatures"
        run: |
          docker run --rm -v "$PWD:/repo:ro" eclipse-temurin:21-jdk-alpine \
            sh -c "apk add -q --no-cache python3 py3-cryptography py3-yaml && sh /repo/tests/publication/publication_test.sh"
      - name: "Médias du fil : adresses de vidéos piégées, image montrée une seule fois, hôtes du CSP"
        run: docker run --rm -v "$PWD:/repo:ro" node:22-alpine node /repo/tests/chat/medias_test.mjs
      - name: Logique
        run: |
          docker run --rm -v "$PWD/server:/app" -v "$PWD/tests:/tests" python:3.12-slim \
            sh -c "pip install -q -r /app/requirements.txt && python /tests/updates/logic_test.py"
      - name: Configuration écrite dans l'agent
        run: |
          docker run --rm -v "$PWD/server:/app" -v "$PWD/tests:/tests" python:3.12-slim sh -c "pip install -q -r /app/requirements.txt && python /tests/agents/config_agent_test.py"
      - name: Connexions sans copier-coller et logos
        run: |
          docker run --rm -v "$PWD/server:/app" -v "$PWD/tests:/tests" python:3.12-slim             sh -c "pip install -q -r /app/requirements.txt && python /tests/agents/connexion_logos_test.py"
      - name: Dossiers de l'ordinateur et appareils
        run: |
          docker run --rm -v "$PWD/server:/app" -v "$PWD/tests:/tests" python:3.12-slim sh -c "pip install -q -r /app/requirements.txt && python /tests/desktop/appareils_test.py"
          docker run --rm -v "$PWD:/repo:ro" node:22-alpine node /repo/tests/desktop/dossiers_test.mjs
          docker run --rm -v "$PWD:/repo:ro" node:22-alpine node /repo/tests/desktop/fichiers_test.mjs
          node tests/desktop/pont_reel.mjs
      - name: Appairage
        run: |
          docker run --rm -v "$PWD/server:/app" -v "$PWD/tests:/tests" \
            -v "$PWD/frontend/src/App.tsx:/front/App.tsx:ro" -v "$PWD/mobile/www/app.js:/mobile/app.js:ro" python:3.12-slim \
            sh -c "pip install -q -r /app/requirements.txt && python /tests/pairing/pairing_test.py"
      - name: Attaques contre le QR et le code de liaison, sur un vrai serveur HTTP
        run: |
          docker run --rm -v "$PWD/server:/app" -v "$PWD/tests:/tests" python:3.12-slim \
            sh -c "pip install -q -r /app/requirements.txt && python /tests/pairing/attaques_test.py"
      - name: "X-Forwarded-For falsifié à travers un vrai Caddy"
        run: sh tests/pairing/xff_caddy.sh
      - name: Jeton du QR et empreintes en base (G2.2, G2.4)
        run: |
          docker run --rm -v "$PWD/server:/app" -v "$PWD/tests:/tests" python:3.12-slim \
            sh -c "pip install -q -r /app/requirements.txt && python /tests/pairing/qr_jeton_test.py && python /tests/pairing/empreintes_test.py"
      - name: Ports publiés et sorties du serveur (G7.1, G7.3, sans réseau réel)
        run: |
          docker run --rm -v "$PWD:/repo:ro" python:3.12-slim sh -c \
            "pip install -q -r /repo/server/requirements.txt && python /repo/tests/exposition/exposition_test.py && python -u /repo/tests/exposition/sorties_test.py"
          docker run --rm -v "$PWD:/repo:ro" node:22-alpine node /repo/tests/exposition/bureau_test.mjs
      - name: "Exposition publique : en-têtes, robots, routes internes, connexion, autre origine"
        run: |
          docker run --rm -v "$PWD:/repo:ro" python:3.12-slim sh -c \
            "pip install -q -r /repo/server/requirements.txt && python /repo/tests/exposition/public_test.py"
      - name: "Accords synchronisés : concurrence, profils, reprise SSE et sécurité du bureau (#36)"
        run: |
          docker run --rm -v "$PWD:/repo:ro" python:3.12-slim sh -c \
            "pip install -q -r /repo/server/requirements.txt && python /repo/tests/exposition/accords_sync_test.py"
          node tests/desktop/accords_sync_test.mjs
      - name: "Bureau sans boîte système : bandeau isolé, accord unique et autonomie locale (#35)"
        run: node tests/desktop/accord_test.mjs
      - name: "Lot 2 : SSRF, préférences par compte, reprise et aperçus"
        run: |
          docker run --rm -v "$PWD:/repo:ro" python:3.12-slim sh -c "pip install -q -r /repo/server/requirements.txt && python /repo/tests/exposition/safefetch_test.py && python /repo/tests/exposition/lot2_test.py"
      - name: Notifications Web Push (vérifiées par http_ece et PyJWT)
        run: |
          docker run --rm -v "$PWD/server:/app" -v "$PWD/tests:/tests" python:3.12-slim sh -c \
            "pip install -q -r /app/requirements.txt http_ece==1.2.1 'pyjwt[crypto]==2.10.1' && python /tests/push/push_test.py"
      - name: "Notifications par compte : appels sur demande, fin de tâche, types à couper"
        run: |
          docker run --rm -v "$PWD/server:/app" -v "$PWD/tests:/tests" python:3.12-slim sh -c "pip install -q -r /app/requirements.txt && python /tests/push/preferences_test.py"
      - name: Aucun contenu en clair chez un tiers (capture simulée, puis vrai ntfy en TLS)
        run: |
          docker run --rm -v "$PWD/server:/app" -v "$PWD/tests:/tests" -v "$PWD/mobile:/mobile:ro" python:3.12-slim sh -c \
            "pip install -q -r /app/requirements.txt http_ece==1.2.1 && python /tests/push/tiers_test.py"
          sh tests/push/ntfy_test.sh
      - name: Jeton Android chiffré par le Keystore (vrai Pairing.java sur un Keystore simulé, grep des dépendances)
        run: |
          sh tests/android/droits_test.sh
          docker run --rm -v "$PWD/mobile:/mobile:ro" -v "$PWD/tests:/tests:ro" eclipse-temurin:21-jdk-alpine \
            sh /tests/android/keystore_test.sh
          docker run --rm -v "$PWD/server:/app" -v "$PWD/tests:/tests" python:3.12-slim sh -c \
            "pip install -q -r /app/requirements.txt && python /tests/android/jeton_test.py"
      - name: Plafond de dépense quotidien par agent
        run: |
          docker run --rm -v "$PWD/server:/app" -v "$PWD/tests:/tests" python:3.12-slim sh -c \
            "pip install -q -r /app/requirements.txt && python /tests/budget/budget_test.py"
      - name: Fournisseurs (Ollama, Ollama Cloud, Mammouth, service compatible OpenAI)
        run: |
          docker run --rm -v "$PWD/server:/app" -v "$PWD/tests:/tests" python:3.12-slim sh -c             "pip install -q -r /app/requirements.txt && python /tests/providers/provider_test.py"
      - name: "Relais : flux compressé par le fournisseur"
        run: |
          docker run --rm -v "$PWD/server:/app" -v "$PWD/tests:/tests" python:3.12-slim sh -c "pip install -q -r /app/requirements.txt && python /tests/providers/flux_compresse_test.py"
      - name: Clé refusée à l'enregistrement, vraie raison sur la voix
        run: |
          docker run --rm -v "$PWD/server:/app" -v "$PWD/tests:/tests" python:3.12-slim sh -c "pip install -q -r /app/requirements.txt && python /tests/providers/cle_refusee_test.py"
      - name: Erreurs lisibles, détails, jamais de silence
        run: |
          docker run --rm -v "$PWD/server:/app" -v "$PWD/tests:/tests" python:3.12-slim sh -c "pip install -q -r /app/requirements.txt && python /tests/coordination/erreurs_test.py"
      - name: "Lanceur sur un petit VPS"
        run: |
          docker run --rm -v "$PWD/launcher:/launcher:ro" -v "$PWD/tests:/tests:ro" python:3.12-slim sh -c "pip install -q fastapi pydantic httpx && python /tests/agents/petit_vps_test.py"
      - name: "Publication : Instagram et X par leur API, un post part une seule fois, le jeton reste sur le serveur"
        run: |
          docker run --rm -v "$PWD/server:/app" -v "$PWD/tests:/tests" python:3.12-slim sh -c "pip install -q -r /app/requirements.txt && python /tests/tools/publication_test.py"
      - name: "Chat vivant : réponse sans récit du travail, réactions, réponses à toucher"
        run: |
          docker run --rm -v "$PWD/server:/app" -v "$PWD/tests:/tests" python:3.12-slim sh -c "pip install -q -r /app/requirements.txt && python /tests/agents/chat_vivant_test.py"
      - name: "Fil et fichiers : conversation par tranches, suppression selon le droit, sans suivre de lien"
        run: |
          docker run --rm -v "$PWD/server:/app" -v "$PWD/launcher:/l:ro" -v "$PWD/tests:/tests" python:3.12-slim sh -c "pip install -q -r /app/requirements.txt && python /tests/agents/fil_fichiers_test.py"
      - name: "Aperçu : une app charge ses fichiers sans sortir de son dossier"
        run: |
          docker run --rm -v "$PWD/server:/app" -v "$PWD/tests:/tests" python:3.12-slim sh -c "pip install -q -r /app/requirements.txt && python /tests/agents/apercu_test.py"
      - name: "Appel : une demande en attente survit au raccroché"
        run: |
          docker run --rm -v "$PWD/server:/app" -v "$PWD/tests:/tests" python:3.12-slim sh -c "pip install -q -r /app/requirements.txt && python /tests/voice/ensuite_test.py"
      - name: "Chat : écrire pendant le travail, réponse rapide, précision, file durable, activité précise"
        run: |
          docker run --rm -v "$PWD/server:/app" -v "$PWD/tests:/tests" python:3.12-slim sh -c "pip install -q -r /app/requirements.txt && python /tests/voice/pendant_test.py"
      - name: "Chat : un message sans rapport n'est pas une reprise, et le premier message après un redémarrage est chaud"
        run: |
          docker run --rm -v "$PWD/server:/app" -v "$PWD/tests:/tests" python:3.12-slim sh -c "pip install -q -r /app/requirements.txt && python /tests/voice/reprise_test.py"
      - name: "Objectifs et tour de lui-même : rien de neuf ne coûte rien, un seul tour à la fois, budget, tâche en cours, invité refusé"
        run: |
          docker run --rm -v "$PWD/server:/app" -v "$PWD/tests:/tests" python:3.12-slim sh -c "pip install -q -r /app/requirements.txt && python /tests/agents/proactif_test.py"
      - name: "Il apprend sans qu'on le demande : une relecture par correction, plafond, 👎 qui demande, une réaction n'autorise rien, rien de dehors ni d'un invité"
        run: |
          docker run --rm -v "$PWD/server:/app" -v "$PWD/tests:/tests" python:3.12-slim sh -c "pip install -q -r /app/requirements.txt && python /tests/agents/apprendre_test.py"
      - name: "Le reçu : ce que l'agent dit est comparé à ce que ses outils ont fait, dans les deux sens, sans fausse alerte sur un doute"
        run: |
          docker run --rm -v "$PWD/server:/app" -v "$PWD/tests:/tests" python:3.12-slim sh -c "pip install -q -r /app/requirements.txt && python /tests/agents/recu_test.py"
      - name: Veilles sans appel au modèle quand la page ne bouge pas
        run: |
          docker run --rm -v "$PWD/server:/app" -v "$PWD/tests:/tests" python:3.12-slim sh -c \
            "pip install -q -r /app/requirements.txt && python /tests/watch/watch_test.py"
      - name: "Modèle de décision, routines à deux étages, mémoire jugée (30 passages, coût avant et après)"
        run: |
          docker run --rm -v "$PWD/server:/app" -v "$PWD/launcher:/l:ro" -v "$PWD/tests:/tests" python:3.12-slim sh -c \
            "pip install -q -r /app/requirements.txt && python /tests/agents/decision_test.py"
      - name: "Modèle rapide : premier mot mesuré, le plus rapide gardé pour cette clé"
        run: |
          docker run --rm -v "$PWD/server:/app" -v "$PWD/tests:/tests" python:3.12-slim sh -c \
            "pip install -q -r /app/requirements.txt && python /tests/agents/modele_rapide_test.py"
      - name: "Routines sur un vrai Hermes : à l'heure, conversation, notification, condition, mémoire (faux modèle)"
        run: node tests/real/routines_reelles.mjs faux
      - name: Demandes entre agents et rappels vocaux
        run: |
          docker run --rm -v "$PWD/server:/app" -v "$PWD/tests:/tests" python:3.12-slim sh -c \
            "pip install -q -r /app/requirements.txt && python /tests/coordination/coordination_test.py"
      - name: Voix
        run: |
          docker run --rm -v "$PWD/server:/app" -v "$PWD/tests:/tests" python:3.12-slim sh -c \
            "pip install -q -r /app/requirements.txt && python /tests/voice/voice_test.py && python /tests/voice/precall_test.py && python /tests/coordination/injoignable_test.py && python /tests/coordination/silence_test.py && python /tests/budget/repos_navigateur_test.py"
      - name: Profils et partage (isolation sur toutes les routes)
        run: |
          docker run --rm -v "$PWD/server:/app" -v "$PWD/tests:/tests" python:3.12-slim sh -c \
            "pip install -q -r /app/requirements.txt && python /tests/profiles/profiles_test.py && python /tests/agents/liste_agents_test.py"
      - name: Outils MCP au choix (adresses, jeton, droits, panne, accès)
        run: |
          docker run --rm -v "$PWD/server:/app" -v "$PWD/launcher:/l" -v "$PWD/tests:/tests" \
            -v "$PWD/frontend/src/components:/front:ro" python:3.12-slim sh -c \
            "pip install -q -r /app/requirements.txt && python /tests/tools/mcp_test.py"
      - name: "Juge des actions et tri des entrées : règles sans modèle, panne = accord, aveugle au contenu, corpus d'attaques"
        run: |
          docker run --rm -v "$PWD/server:/app" -v "$PWD/tests:/tests" python:3.12-slim sh -c "pip install -q -r /app/requirements.txt && python /tests/tools/juge_test.py"
          docker run --rm -v "$PWD/server:/app" -v "$PWD/tests:/tests" python:3.12-slim sh -c "pip install -q -r /app/requirements.txt && python /tests/tools/google_droit_test.py"
          docker run --rm -v "$PWD/server:/app" -v "$PWD/tests:/tests" python:3.12-slim sh -c "pip install -q -r /app/requirements.txt && python /tests/tools/auto_test.py && python /tests/tools/sites_test.py"
      - name: "Connecteurs globaux et compétences : exclusion réelle, agent neuf, droits par agent, invités, autre compte"
        run: |
          docker run --rm -v "$PWD/server:/app" -v "$PWD/launcher:/l" -v "$PWD/tests:/tests" python:3.12-slim sh -c "pip install -q -r /app/requirements.txt && python /tests/tools/connecteurs_test.py"
      - name: Restauration (archive refusée si elle sort de backup.sh)
        run: |
          docker run --rm -e NOAH_TOOL=1 -v "$PWD/launcher:/l" -v "$PWD/tests:/tests" python:3.12-slim sh -c \
            "pip install -q docker cryptography && python /tests/restore/inspect_test.py"
      - name: Garde des skills dans chaque agent
        run: |
          docker run --rm -v "$PWD/server:/app" -v "$PWD/tests:/tests" python:3.12-slim python /tests/skills/guard_test.py
      - name: Joindre un fichier à une page (clé, plafonds, champ jamais deviné, fichiers de travail seulement)
        run: |
          docker run --rm -v "$PWD/launcher/camofox-noah:/p:ro" -v "$PWD/tests:/tests:ro" node:22-alpine \
            sh -c "mkdir -p /data && node /tests/navigateur/envoi_test.mjs"
          docker run --rm -v "$PWD/launcher/camofox-noah:/p:ro" -v "$PWD/tests:/tests:ro" node:22-alpine \
            sh -c "mkdir -p /data && node /tests/navigateur/sessions_test.mjs"
          docker run --rm -v "$PWD/server:/app" -v "$PWD/tests:/tests" python:3.12-slim python /tests/navigateur/envoi_outil_test.py
      - name: "Se connecter à un site : l'agent ne voit jamais le mot de passe (usage unique, expiration, droits, origine de la page)"
        run: |
          docker run --rm -v "$PWD/server:/app" -v "$PWD/tests:/tests" python:3.12-slim sh -c "pip install -q -r /app/requirements.txt && python /tests/tools/coffre_test.py"
          docker run --rm -v "$PWD/launcher/camofox-noah:/p:ro" -v "$PWD/tests:/tests:ro" node:22-alpine \
            sh -c "mkdir -p /data && node /tests/navigateur/connexion_test.mjs"
      - name: Aucune capture pendant une prise en main (clé à part, gardée au redémarrage)
        run: |
          docker run --rm -v "$PWD/launcher/camofox-noah:/p:ro" -v "$PWD/tests:/tests:ro" node:22-alpine \
            sh -c "mkdir -p /data && node /tests/handoff/private_test.mjs"
          docker run --rm -v "$PWD/server:/app" -v "$PWD/tests:/tests" python:3.12-slim sh -c \
            "pip install -q -r /app/requirements.txt && python /tests/handoff/keeper_test.py"
      - name: Code d'installation et redémarrage du VPS
        run: |
          docker run --rm -v "$PWD/server:/app" -v "$PWD/tests:/tests" python:3.12-slim sh -c \
            "pip install -q -r /app/requirements.txt && python /tests/install/setup_test.py"
      - name: "Mot de passe oublié : code de récupération à usage unique, essais limités"
        run: |
          docker run --rm -v "$PWD/server:/app" -v "$PWD/tests:/tests" python:3.12-slim sh -c "pip install -q -r /app/requirements.txt && python /tests/install/recuperation_test.py"
      - name: "Double vérification : activation, code rejoué, codes de secours, force brute, profils, récupération"
        run: |
          docker run --rm -v "$PWD/server:/app" -v "$PWD/tests:/tests" python:3.12-slim sh -c "pip install -q -r /app/requirements.txt && python /tests/install/double_verification_test.py"
      - name: "Comptes : jeton volé, premier compte au déploiement, mot de passe temporaire, profils, courriel de confirmation, nouvel appareil"
        run: |
          docker run --rm -v "$PWD/server:/app" -v "$PWD/tests:/tests" python:3.12-slim sh -c "pip install -q -r /app/requirements.txt && python /tests/install/comptes_test.py"
          docker run --rm -v "$PWD:/repo:ro" alpine sh /repo/tests/install/get_admin.sh
      - name: Aucun bouton n'envoie un corps vide à une route qui exige un champ
        run: |
          docker run --rm -v "$PWD/server:/app" -v "$PWD/frontend:/frontend:ro" -v "$PWD/tests:/tests" python:3.12-slim sh -c "pip install -q -r /app/requirements.txt && python /tests/sources/corps_vides_test.py"
      - name: Changer de modèle est instantané, sans redémarrage
        run: |
          docker run --rm -v "$PWD/server:/app" -v "$PWD/tests:/tests" python:3.12-slim sh -c "pip install -q -r /app/requirements.txt && python /tests/agents/modele_instantane_test.py"
      - name: Modes, chaîne de modèles, routines et vrais modèles de décision
        run: |
          docker run --rm -v "$PWD/server:/app" -v "$PWD/tests:/tests" python:3.12-slim sh -c "pip install -q -r /app/requirements.txt && python /tests/agents/modes_test.py"
      - name: L'agent change ses réglages non sensibles, et rien d'autre
        run: |
          docker run --rm -v "$PWD/server:/app" -v "$PWD/tests:/tests" python:3.12-slim sh -c "pip install -q -r /app/requirements.txt && python /tests/agents/reglages_test.py"
      - name: Une seule voix par réponse (secours, coupure, réponse suivante)
        run: |
          docker run --rm -v "$PWD/server:/app" -v "$PWD/tests:/tests" python:3.12-slim sh -c "pip install -q -r /app/requirements.txt && python /tests/voice/une_voix_test.py"
      - name: Hermes figé sur la version testée (empreinte unique, navigateur Camofox présent)
        run: sh tests/publication/hermes_fige_test.sh
      - name: Caddyfile du VPS
        run: |
          docker run --rm -e NOAH_DOMAIN=noah.example.com -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: "Journal d'accès de Caddy : ni code d'installation ni jeton d'aperçu"
        run: sh tests/exposition/journaux_caddy.sh
      - name: Adresses montrées (jamais une IP en http, sortie réelle de get.sh et install.sh)
        run: node tests/pwa/urls_https_test.mjs
      - name: Sources de tout ce qui est distribué (suivies par git, sans dépôt privé)
        run: node tests/sources/sources_test.mjs --local
      # Les sabotages (près de 250 conteneurs) tournent à part : .github/workflows/sensibilite.yml.
      - name: Score par niveau de preuve et option --depuis des sabotages
        run: |
          node tests/eval/score_test.mjs
          node tools/eval/score.mjs --check
          node tests/eval/depuis_test.mjs
      - name: Transaction sur conteneurs
        if: ${{ !inputs.rapide }}
        run: sh tests/updates/docker_test.sh
