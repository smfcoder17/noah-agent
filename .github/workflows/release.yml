# Publie les images de Noah Agent sur GHCR : un VPS les télécharge au lieu de les compiler.
# Étiquette v1.2.3 → images 1.2.3, 1.2 et stable ; chaque commit sur main → image edge (canal « en avance »).
# Une seule fois après la première publication : GitHub > Packages > noah-server et noah-launcher > Package settings
# > Change visibility > Public (sinon un VPS ne peut pas les télécharger sans se connecter).
name: Images

on:
  push:
    tags: ["v*.*.*"]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: noah-server
            context: .
            file: server/Dockerfile
          - name: noah-launcher
            context: launcher
            file: launcher/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=${{ matrix.name }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NOAH_VERSION=${{ steps.meta.outputs.version }}
            NOAH_UPDATE_KEY=${{ vars.NOAH_UPDATE_KEY }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # Manifeste signé de la version : les serveurs déjà installés le lisent et se mettent à jour pendant leur créneau
  # calme. Il fige aussi les dépendances (Hermes, navigateur, Caddy) par empreinte : elles n'arrivent chez les
  # utilisateurs qu'avec une version de Noah, jamais d'elles-mêmes.
  manifest:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch --force --tags
      - uses: docker/setup-buildx-action@v3
      - name: Empreintes des images
        id: refs
        run: |
          set -e
          digest() { docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -r .digest; }
          v="${GITHUB_REF_NAME#v}"
          owner=$(echo "${{ github.repository_owner }}" | tr A-Z a-z)
          {
            echo "noah-server=ghcr.io/$owner/noah-server@$(digest ghcr.io/$owner/noah-server:$v)"
            echo "noah-launcher=ghcr.io/$owner/noah-launcher@$(digest ghcr.io/$owner/noah-launcher:$v)"
            echo "hermes=nousresearch/hermes-agent@$(digest nousresearch/hermes-agent:stable)"
            echo "navigateur=ghcr.io/jo-inc/camofox-browser@$(digest ghcr.io/jo-inc/camofox-browser:latest)"
            echo "caddy=caddy@$(digest caddy:2.10-alpine)"
          } > refs.txt
          cat refs.txt
      - name: Signature
        env:
          NOAH_RELEASE_KEY: ${{ secrets.NOAH_RELEASE_KEY }}
        run: |
          pip install --quiet cryptography==44.0.0
          git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format="%(contents)" > notes.md  # message de l'étiquette ; « [migration] » s'il change les données
          python scripts/release-manifest.py signer "${GITHUB_REF_NAME#v}" notes.md $(cat refs.txt)
      - name: Compose épinglé
        run: |
          # Le compose de la version : chaque image remplacée par son empreinte (celle du manifeste signé).
          set -e
          ref() { sed -n "s/^$1=//p" refs.txt; }
          owner=$(echo "${{ github.repository_owner }}" | tr A-Z a-z)
          sed -e "s#ghcr.io/$owner/noah-server:stable#$(ref noah-server)#"               -e "s#ghcr.io/$owner/noah-launcher:stable#$(ref noah-launcher)#"               -e "s#caddy:2.10-alpine#$(ref caddy)#"               -e "s#nousresearch/hermes-agent:stable#$(ref hermes)#"               -e "s#ghcr.io/jo-inc/camofox-browser:latest#$(ref navigateur)#"               deploy/docker-compose.yml > docker-compose.yml
          if grep -nE "image: [^@]+$|_IMAGE: [^@]+$" docker-compose.yml; then echo "image non épinglée" >&2; exit 1; fi
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            manifest.json
            manifest.json.sig
            docker-compose.yml
