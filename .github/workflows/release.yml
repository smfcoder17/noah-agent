# Publie une version complète de Noah Agent en une étiquette annotée (son message devient la note de version) :
#   git tag -a v1.2.3 -m "Ce qui change" && git push origin v1.2.3
#
#   controle   clés présentes et cohérentes, sinon rien ne part (scripts/controle-publication.sh)
#   (la suite entière se joue avant, en local : node scripts/verifier.mjs. La CI est payée à la minute, elle construit et publie.)
#   image      images GHCR multi-architecture : 1.2.3 et 1.2
#   apps       APK signé et installateur Windows (apps.yml)
#   publier    empreintes, compose épinglé, manifeste signé, Release en brouillon, étiquette stable, puis Release publié
#
# Tout attend tout : releases/latest/download/, que lisent les serveurs déjà installés, get.sh et Hostinger, ne change
# qu'une fois le Release complet, et :stable ne bouge que si tout le reste a réussi. Relancer le même run ou
# « gh workflow run release.yml --ref v1.2.3 » reprend sans dégât.
#
# v1.2.3-rc1 : même chemin, images 1.2.3-rc1, Release marqué préversion ; ni :stable, ni manifeste, ni « latest ».
# Sans étiquette (gh workflow run release.yml, depuis main) : image edge seulement.
#
# Les clés : sh scripts/preparer-signatures.sh. Les paquets GHCR noah-server et noah-launcher sont déjà publics ; noah-browser est à rendre public à sa première publication.
name: Publication

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.controle.outputs.version }}
      stable: ${{ steps.controle.outputs.stable }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "21"
      - run: pip install --quiet cryptography==44.0.0
      - id: controle
        env:
          NOAH_RELEASE_KEY: ${{ secrets.NOAH_RELEASE_KEY }}
          NOAH_UPDATE_KEY: ${{ vars.NOAH_UPDATE_KEY }}
          NOAH_APK_KEYSTORE: ${{ secrets.NOAH_APK_KEYSTORE }}
          NOAH_APK_KEYSTORE_PASSWORD: ${{ secrets.NOAH_APK_KEYSTORE_PASSWORD }}
          NOAH_APK_KEY_ALIAS: ${{ secrets.NOAH_APK_KEY_ALIAS }}
        run: sh scripts/controle-publication.sh

  image:
    needs: controle
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - name: noah-server
            context: .
            file: server/Dockerfile
          - name: noah-launcher
            context: launcher
            file: launcher/Dockerfile
          - name: noah-browser
            context: launcher/camofox-bureau
            file: launcher/camofox-bureau/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=${{ matrix.name }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NOAH_VERSION=${{ steps.meta.outputs.version }}
            NOAH_UPDATE_KEY=${{ vars.NOAH_UPDATE_KEY }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  apps:
    needs: controle
    if: needs.controle.outputs.version != ''
    permissions:
      contents: read
    uses: ./.github/workflows/apps.yml
    secrets:
      NOAH_APK_KEYSTORE: ${{ secrets.NOAH_APK_KEYSTORE }}
      NOAH_APK_KEYSTORE_PASSWORD: ${{ secrets.NOAH_APK_KEYSTORE_PASSWORD }}
      NOAH_APK_KEY_ALIAS: ${{ secrets.NOAH_APK_KEY_ALIAS }}

  # Le seul endroit qui écrit le Release. Le manifeste signé fige toutes les images par empreinte, y compris les
  # dépendances (Hermes, navigateur, Caddy) : elles n'arrivent chez les utilisateurs qu'avec une version de Noah.
  publier:
    needs: [controle, image, apps]
    if: needs.controle.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.controle.outputs.version }}
      STABLE: ${{ needs.controle.outputs.stable }}
      OWNER: ${{ github.repository_owner }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch --force --tags  # checkout remplace une étiquette annotée par une simple : le message serait perdu
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: noah-*
          path: apps
      - name: Empreintes des images
        run: |
          sh scripts/empreintes-images.sh "$OWNER" "$VERSION" > refs.txt
          cat refs.txt
      - name: Compose épinglé
        run: |
          mkdir dist
          sh scripts/compose-version.sh "$OWNER" refs.txt deploy/docker-compose.yml > dist/docker-compose.yml
          docker compose -f dist/docker-compose.yml config -q
      - name: Manifeste signé
        if: needs.controle.outputs.stable == 'true'
        env:
          NOAH_RELEASE_KEY: ${{ secrets.NOAH_RELEASE_KEY }}
        run: |
          pip install --quiet cryptography==44.0.0
          git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format="%(contents)" > notes.md  # « [migration] » s'il change les données
          cd dist
          python ../scripts/release-manifest.py signer "$VERSION" ../notes.md $(cat ../refs.txt)
      - name: Applications jointes
        run: |
          # Seul l'APK signé est joint : celui de débogage demanderait de désinstaller l'app à chaque version.
          if [ -f apps/noah-android/noah-agent-android.apk ]; then
            cp apps/noah-android/noah-agent-android.apk dist/
          elif [ "$STABLE" = true ]; then
            echo "::error::Pas d'APK signé pour une version stable."
            exit 1
          else
            echo "::warning::Préversion sans APK signé : aucun APK joint."
          fi
          n=$(ls apps/noah-bureau/*Setup*.exe | wc -l)
          [ "$n" = 1 ] || { echo "::error::$n installateurs Windows au lieu d'un seul."; exit 1; }
          cp apps/noah-bureau/*Setup*.exe dist/noah-agent-windows-setup.exe
          if [ "$STABLE" = true ]; then
            for f in docker-compose.yml manifest.json manifest.json.sig noah-agent-android.apk noah-agent-windows-setup.exe; do
              [ -s "dist/$f" ] || { echo "::error::$f manque au Release."; exit 1; }
            done
          fi
          ls -l dist
      - name: Release en brouillon
        run: |
          git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format="%(contents)" > notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag --title "Noah Agent $VERSION" --notes-file notes.md
          fi
      - name: Étiquette stable, seulement maintenant
        if: needs.controle.outputs.stable == 'true'
        run: |
          owner=$(echo "$OWNER" | tr 'A-Z' 'a-z')
          for image in noah-server noah-launcher noah-browser; do
            docker buildx imagetools create -t "ghcr.io/$owner/$image:stable" "ghcr.io/$owner/$image:$VERSION"
          done
      - name: Release publié
        run: |
          if [ "$STABLE" = true ]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          else
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease
          fi
