# Construit l'APK et l'installateur de bureau depuis les sources, sur une machine propre. Rien n'est publié ici : c'est
# release.yml qui attache les deux à la version, une fois tout le reste prêt (un Release à moitié rempli casserait
# releases/latest/download/ pour tout le monde).
name: Applications

# À la demande (gh workflow run apps.yml), ou appelé par release.yml pour une version : la CI est limitée.
on:
  workflow_dispatch:
  workflow_call:
    secrets:
      NOAH_APK_KEYSTORE:
        required: false
      NOAH_APK_KEYSTORE_PASSWORD:
        required: false
      NOAH_APK_KEY_ALIAS:
        required: false

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Numéro de version de l'étiquette
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) echo "NOAH_APK_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV" ;;
          esac
      - name: Sources de l'app
        working-directory: mobile
        run: |
          npm ci
          npx cap sync android
          chmod +x android/gradlew
      # Sans les trois secrets : repli sur un APK de débogage, pour essayer le build. Jamais joint à une version
      # (controle-publication.sh refuse une version stable sans keystore, et release.yml ne joint que l'APK signé).
      - name: Keystore
        id: cle
        env:
          NOAH_APK_KEYSTORE: ${{ secrets.NOAH_APK_KEYSTORE }}
          NOAH_APK_KEYSTORE_PASSWORD: ${{ secrets.NOAH_APK_KEYSTORE_PASSWORD }}
          NOAH_APK_KEY_ALIAS: ${{ secrets.NOAH_APK_KEY_ALIAS }}
        run: |
          if [ -n "$NOAH_APK_KEYSTORE" ] && [ -n "$NOAH_APK_KEYSTORE_PASSWORD" ] && [ -n "$NOAH_APK_KEY_ALIAS" ]; then
            printf '%s' "$NOAH_APK_KEYSTORE" | base64 -d > "$RUNNER_TEMP/noah.keystore"
            echo "signe=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=APK de débogage::Secrets NOAH_APK_KEYSTORE, NOAH_APK_KEYSTORE_PASSWORD ou NOAH_APK_KEY_ALIAS absents : APK de débogage, à ne pas distribuer (sh scripts/preparer-signatures.sh)."
            echo "signe=false" >> "$GITHUB_OUTPUT"
          fi
      - name: APK signé
        if: steps.cle.outputs.signe == 'true'
        working-directory: mobile/android
        env:
          NOAH_APK_KEYSTORE_FILE: ${{ runner.temp }}/noah.keystore
          NOAH_APK_KEYSTORE_PASSWORD: ${{ secrets.NOAH_APK_KEYSTORE_PASSWORD }}
          NOAH_APK_KEY_ALIAS: ${{ secrets.NOAH_APK_KEY_ALIAS }}
        run: |
          # Les fichiers de release GitHub répondent parfois 504 (8 novembre 2026) : la même construction, jusqu'à 4 fois.
          for essai in 1 2 3 4; do ./gradlew assembleRelease --no-daemon && break; [ "$essai" = 4 ] && exit 1; echo "::warning::essai $essai échoué, nouvel essai dans 60 s"; sleep 60; done
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --no-daemon > "$RUNNER_TEMP/dependances.txt"
          mkdir -p "$RUNNER_TEMP/apk"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/apk/noah-agent-android.apk"
          sh ../../tests/android/apk_signature.sh "$RUNNER_TEMP/apk/noah-agent-android.apk"
      - name: APK de débogage
        if: steps.cle.outputs.signe != 'true'
        working-directory: mobile/android
        run: |
          # Les fichiers de release GitHub répondent parfois 504 (8 novembre 2026) : la même construction, jusqu'à 4 fois.
          for essai in 1 2 3 4; do ./gradlew assembleDebug --no-daemon && break; [ "$essai" = 4 ] && exit 1; echo "::warning::essai $essai échoué, nouvel essai dans 60 s"; sleep 60; done
          ./gradlew :app:dependencies --configuration debugRuntimeClasspath --no-daemon > "$RUNNER_TEMP/dependances.txt"
          mkdir -p "$RUNNER_TEMP/apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/apk/noah-agent-android-debug.apk"
      - name: Keystore retiré de la machine
        if: always()
        run: rm -f "$RUNNER_TEMP/noah.keystore"
      - name: Pas d'EncryptedSharedPreferences dans l'APK ni dans les dépendances résolues
        run: sh tests/android/apk_scan.sh "$RUNNER_TEMP"/apk/*.apk "$RUNNER_TEMP/dependances.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: noah-android
          path: ${{ runner.temp }}/apk/*.apk
          if-no-files-found: error

  bureau:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Installateur Windows
        working-directory: desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm ci
          case "$GITHUB_REF" in
            refs/tags/v*) npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version ;;
          esac
          # Les fichiers de release GitHub répondent parfois 504 (8 novembre 2026) : la même construction, jusqu'à 4 fois.
          for essai in 1 2 3 4; do npx electron-builder --win --x64 --publish never && break; [ "$essai" = 4 ] && exit 1; echo "::warning::essai $essai échoué, nouvel essai dans 60 s"; sleep 60; done
      - uses: actions/upload-artifact@v4
        with:
          name: noah-bureau
          path: desktop/dist/*Setup*.exe
          if-no-files-found: error
