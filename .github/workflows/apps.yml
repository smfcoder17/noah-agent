# Construit l'APK et l'installateur de bureau depuis les sources, sur une machine propre. Une version y joint les deux.
name: Applications

# Seulement pour une version, ou à la demande : la CI est limitée.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: APK
        working-directory: mobile
        run: |
          npm ci
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Pas d'EncryptedSharedPreferences dans l'APK ni dans les dépendances résolues
        working-directory: mobile/android
        run: |
          ./gradlew :app:dependencies --configuration debugRuntimeClasspath --no-daemon > "$RUNNER_TEMP/dependances.txt"
          sh ../../tests/android/apk_scan.sh app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/dependances.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: noah-android
          path: mobile/android/app/build/outputs/apk/debug/*.apk
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: mobile/android/app/build/outputs/apk/debug/*.apk

  bureau:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Installateur Windows
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm ci
          npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: noah-bureau
          path: desktop/dist/*.exe
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: desktop/dist/*.exe
