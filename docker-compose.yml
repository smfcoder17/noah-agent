name: apollo

services:
  # Interface web + API Apollo : le seul service exposé.
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: apollo-server
    restart: unless-stopped
    ports:
      # 127.0.0.1 par défaut. Pour un autre appareil, donne à Noah une adresse HTTPS (README, « Depuis ton téléphone »).
      - "${APOLLO_BIND:-127.0.0.1}:${APOLLO_PORT:-8080}:8080"
    environment:
      APOLLO_SECRET_KEY: ${APOLLO_SECRET_KEY}
      APOLLO_LOCALE: ${APOLLO_LOCALE:-}
      APOLLO_TIMEZONE: ${APOLLO_TIMEZONE:-}
      LAUNCHER_URL: http://launcher:9000
      NOAH_SETUP_CODE: ${NOAH_SETUP_CODE:-}
      LAUNCHER_KEY: ${LAUNCHER_KEY}
    volumes:
      - apollo-data:/data
    # Le relais de modèle joint Ollama sur la machine hôte.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [apollo]
    depends_on: [launcher]

  # Seul service qui parle à Docker. Crée un conteneur Hermes isolé par agent.
  # Jamais exposé : joignable uniquement par le serveur, avec sa clé.
  launcher:
    build: launcher
    container_name: apollo-launcher
    restart: unless-stopped
    environment:
      LAUNCHER_KEY: ${LAUNCHER_KEY}
      AGENT_IMAGE: nousresearch/hermes-agent:stable
      AGENT_NETWORK: apollo-net
      # Dossiers de l'ordinateur que l'utilisateur peut partager avec ses agents (racines séparées par « ; »).
      # Vide : partage coupé (cas d'un VPS). L'application de bureau le remplit avec le dossier personnel.
      NOAH_SHARE_ROOTS: ${NOAH_SHARE_ROOTS:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # État des mises à jour (versions en service, versions bloquées après un échec).
      - noah-updates:/state
    networks: [apollo]

networks:
  apollo:
    name: apollo-net

volumes:
  noah-updates:
  noah-backups:
  apollo-data:
