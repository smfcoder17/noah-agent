# Noah Agent sur un VPS, sans rien configurer : ce seul fichier suffit.
#
#   - Hostinger : VPS > Docker Manager > Compose > « Compose from URL », colle
#     https://github.com/smfcoder17/noah-agent/releases/latest/download/docker-compose.yml, puis Deploy.
# La copie jointe à chaque version a toutes ses images épinglées par empreinte (celles du manifeste signé) ;
# ce fichier-ci, dans le dépôt, suit les étiquettes.
#   - Ailleurs : curl -fsSL https://raw.githubusercontent.com/smfcoder17/noah-agent/main/get.sh | sh
#
# Au premier démarrage, le serveur tire ses secrets au hasard (volume noah-secrets), trouve l'adresse publique du VPS
# et Caddy obtient un certificat HTTPS pour <ip-en-tirets>.sslip.io. Le lien de création du compte, avec son code
# d'installation, s'affiche dans les journaux du service « server » (Docker Manager > Logs).
# Avec ton propre domaine (qui pointe déjà vers ce VPS) : NOAH_DOMAIN=noah.exemple.com dans le fichier .env à côté.
# Même nom de projet et mêmes volumes que l'installation par install.sh : les sauvegardes servent aux deux.
name: apollo

services:
  server:
    image: ghcr.io/smfcoder17/noah-server:stable
    container_name: apollo-server
    restart: unless-stopped
    environment:
      NOAH_DOMAIN: ${NOAH_DOMAIN:-auto}
      NOAH_SETUP_CODE: auto
      LAUNCHER_URL: http://launcher:9000
      # Notifications Android par un ntfy auto-hébergé : son adresse (ex. ntfy.exemple.org). ntfy.sh marche sans rien.
      NOAH_PUSH_HOSTS: ${NOAH_PUSH_HOSTS:-}
    volumes:
      - apollo-data:/data
      - noah-secrets:/secrets
    networks: [apollo]
    depends_on: [launcher]

  # Seul service qui parle à Docker (accès complet à l'hôte : il crée un conteneur isolé par agent). Jamais exposé.
  launcher:
    image: ghcr.io/smfcoder17/noah-launcher:stable
    container_name: apollo-launcher
    restart: unless-stopped
    environment:
      AGENT_IMAGE: nousresearch/hermes-agent:stable
      BROWSER_IMAGE: ghcr.io/jo-inc/camofox-browser:latest
      AGENT_NETWORK: apollo-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # État des mises à jour (versions en service, versions bloquées après un échec).
      - noah-updates:/state
      - noah-secrets:/secrets:ro
    networks: [apollo]

  # HTTPS automatique. Les certificats ne sont demandés que pour les noms que le serveur reconnaît (/api/tls-ask).
  caddy:
    image: caddy:2.10-alpine
    container_name: apollo-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks: [apollo]
    depends_on: [server]

configs:
  caddyfile:
    content: |
      {
        on_demand_tls {
          ask http://server:8080/api/tls-ask
        }
      }
      https:// {
        tls {
          on_demand
        }
        encode zstd gzip {
          match {
            header Content-Type text/html*
            header Content-Type text/css*
            header Content-Type text/javascript*
            header Content-Type application/javascript*
            header Content-Type application/json*
            header Content-Type image/svg+xml*
          }
        }
        # Journal d'accès tournant (Caddy n'y écrit ni l'en-tête Authorization ni les cookies).
        log {
          output file /data/access.log {
            roll_size 10MiB
            roll_keep 5
          }
        }
        header {
          Strict-Transport-Security "max-age=31536000"
          X-Content-Type-Options nosniff
          Referrer-Policy same-origin
          -Server
        }
        reverse_proxy server:8080 {
          flush_interval -1
        }
      }
      http:// {
        redir https://{host}{uri} permanent
      }

networks:
  apollo:
    name: apollo-net

volumes:
  noah-updates:
  noah-backups:
  apollo-data:
  noah-secrets:
  caddy-data:
  caddy-config:
